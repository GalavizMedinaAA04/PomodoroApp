name: pomodoroapp
description: "Aplicación Pomodoro multiplataforma con enfoque offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2+1
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  sqflite_common_ffi: ^2.4.0+3
  flutter_web_plugins:
    sdk: flutter
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.wav
